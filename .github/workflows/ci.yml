name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_SITE_URL: https://aysllan.com
  NEXT_PUBLIC_ASSETS_URL: https://cdn.aysllan.com
  NEXT_PUBLIC_SITE_ENV: preview
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Verify (format, lint, types, unit, asset scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run assets:scan

  build:
    name: Production build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report
          retention-days: 7

  performance:
    name: Performance (first-load JS budget, Lighthouse)
    needs: verify
    runs-on: ubuntu-latest
    env:
      # Audited as the production site, served locally, so SEO checks see an indexable page.
      NEXT_PUBLIC_SITE_URL: http://localhost:3200
      NEXT_PUBLIC_SITE_ENV: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run budget:js
      - run: npm run lighthouse
      - name: Summarize Lighthouse runs
        if: always()
        run: node scripts/lighthouse-summary.mjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          retention-days: 7
